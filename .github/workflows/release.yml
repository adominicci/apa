name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: macOS universal draft release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: deno install

      - name: Verify version and extract release notes
        id: release-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deno run --allow-read scripts/verify-release-version.ts \
            "$RELEASE_TAG" \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            CHANGELOG.md

          version="${RELEASE_TAG#v}"
          notes_path="$RUNNER_TEMP/tesina-release-notes.md"
          deno run --allow-read scripts/extract-release-notes.ts \
            CHANGELOG.md "$version" > "$notes_path"

          delimiter="TESINA_RELEASE_NOTES_$(uuidgen)"
          if grep -Fqx "$delimiter" "$notes_path"; then
            echo "Release notes contain the generated output delimiter." >&2
            exit 1
          fi

          {
            echo "body<<$delimiter"
            cat "$notes_path"
            echo "$delimiter"
            echo "path=$notes_path"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Build locked updater verifier
        id: updater-verifier
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tesina-updater-verifier-target
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --manifest-path scripts/updater-signature-verifier/Cargo.toml
          verifier="$CARGO_TARGET_DIR/debug/tesina-updater-signature-verifier"
          if [[ ! -x "$verifier" ]]; then
            echo "Updater verifier binary was not built." >&2
            exit 1
          fi
          echo "binary=$verifier" >> "$GITHUB_OUTPUT"

      - name: Build and upload macOS draft
        id: tauri-release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: deno task tauri
          tagName: ${{ github.ref_name }}
          releaseName: Tesina ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: false
          releaseAssetNamePattern: Tesina-macos-universal[ext]
          args: >-
            --target universal-apple-darwin
            --bundles app,dmg

      - name: Verify generated macOS bundles
        id: macos-artifacts
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-release.outputs.artifactPaths }}
        run: |
          deno run \
            --allow-env=TAURI_ARTIFACT_PATHS,GITHUB_OUTPUT \
            --allow-read \
            --allow-write="$GITHUB_OUTPUT" \
            scripts/prepare-macos-release-artifacts.ts

      - name: Verify macOS app and DMG structure
        env:
          APP_PATH: ${{ steps.macos-artifacts.outputs.app }}
          DMG_PATH: ${{ steps.macos-artifacts.outputs.dmg }}
        run: |
          set -euo pipefail

          verify_app_bundle() {
            local app_path="$1"
            local executable_name
            local executable_path
            local archs

            executable_name="$(
              /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
                "$app_path/Contents/Info.plist"
            )"
            if [[ -z "$executable_name" || "$executable_name" == */* ]]; then
              echo "Invalid CFBundleExecutable in $app_path." >&2
              return 1
            fi
            executable_path="$app_path/Contents/MacOS/$executable_name"
            if [[ ! -s "$executable_path" ]]; then
              echo "Missing app executable: $executable_path" >&2
              return 1
            fi

            archs="$(
              lipo -archs "$executable_path" \
                | tr ' ' '\n' \
                | sort \
                | paste -sd ' ' -
            )"
            if [[ "$archs" != "arm64 x86_64" ]]; then
              echo "Expected arm64 x86_64; found: $archs" >&2
              return 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app_path"
          }

          verify_app_bundle "$APP_PATH"
          hdiutil verify "$DMG_PATH"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/tesina-dmg.XXXXXX")"
          cleanup_dmg() {
            hdiutil detach "$mount_dir" > /dev/null 2>&1 \
              || hdiutil detach -force "$mount_dir" > /dev/null 2>&1 \
              || true
            rmdir "$mount_dir" > /dev/null 2>&1 || true
          }
          trap cleanup_dmg EXIT INT TERM
          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mount_dir" "$DMG_PATH" > /dev/null
          if [[ ! -d "$mount_dir/Tesina.app" ]]; then
            echo "Mounted DMG does not contain Tesina.app." >&2
            exit 1
          fi
          verify_app_bundle "$mount_dir/Tesina.app"
          cleanup_dmg
          trap - EXIT INT TERM

      - name: Download draft release verification inputs
        id: draft-download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri-release.outputs.releaseId }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/tesina-draft-release.json"
          latest_json="$RUNNER_TEMP/tesina-latest.json"
          archive_path="$RUNNER_TEMP/Tesina-macos-universal.app.tar.gz"
          signature_path="$archive_path.sig"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$release_json"
          latest_asset_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '.assets[] | select(.name == "latest.json") | .id'
          )"
          archive_asset_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '.assets[] | select(.name == "Tesina-macos-universal.app.tar.gz") | .id'
          )"
          signature_asset_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '.assets[] | select(.name == "Tesina-macos-universal.app.tar.gz.sig") | .id'
          )"
          if [[ ! "$latest_asset_id" =~ ^[0-9]+$ \
            || ! "$archive_asset_id" =~ ^[0-9]+$ \
            || ! "$signature_asset_id" =~ ^[0-9]+$ ]]; then
            echo "Draft release is missing updater verification assets." >&2
            exit 1
          fi
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$latest_asset_id" \
            > "$latest_json"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$archive_asset_id" \
            > "$archive_path"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$signature_asset_id" \
            > "$signature_path"

          {
            echo "release_json=$release_json"
            echo "latest_json=$latest_json"
            echo "archive=$archive_path"
            echo "signature=$signature_path"
          } >> "$GITHUB_OUTPUT"

      - name: Verify downloaded draft release and updater manifest
        env:
          RELEASE_JSON: ${{ steps.draft-download.outputs.release_json }}
          LATEST_JSON: ${{ steps.draft-download.outputs.latest_json }}
          UPDATER_ARCHIVE: ${{ steps.draft-download.outputs.archive }}
          UPDATER_SIGNATURE: ${{ steps.draft-download.outputs.signature }}
          RELEASE_NOTES_PATH: ${{ steps.release-notes.outputs.path }}
          RELEASE_VERSION: ${{ steps.release-notes.outputs.version }}
          UPDATER_VERIFIER_BINARY: ${{ steps.updater-verifier.outputs.binary }}
        run: |
          set -euo pipefail
          deno run --allow-read scripts/verify-release-draft.ts \
            "$RELEASE_JSON" \
            "$LATEST_JSON" \
            "$RELEASE_NOTES_PATH" \
            "$RELEASE_VERSION" \
            "$UPDATER_SIGNATURE"

          "$UPDATER_VERIFIER_BINARY" \
            "$UPDATER_ARCHIVE" \
            "$UPDATER_SIGNATURE" \
            apps/desktop/src-tauri/tauri.conf.json
