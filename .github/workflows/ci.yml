name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --frozen

      - name: Dependency audit
        run: deno audit --frozen

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Svelte check
        run: deno task check

      - name: Unit tests
        run: deno task test

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust format check
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri

      - name: Rust compile check
        run: cargo check --locked
        working-directory: apps/desktop/src-tauri

      - name: Rust tests
        run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  pagination-native-macos:
    name: Pagination proof (WKWebView)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Svelte check
        run: deno task check

      - name: Compile production Tauri library
        run: cargo check --locked --lib
        working-directory: apps/desktop/src-tauri

      - name: Test production Tauri library
        run: cargo test --locked --lib
        working-directory: apps/desktop/src-tauri

      - name: Focused pagination suite
        run: >-
          deno run -A npm:vitest run
          apps/desktop/src/lib/editor/pagination

      - name: Visible WKWebView pagination proof
        env:
          TESINA_PROOF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          deno run -A
          apps/desktop/src/lib/editor/pagination/proof/runNativeProof.ts

  pagination-native-windows:
    name: Pagination proof (WebView2)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install Rust stable for the locked Wry host
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Compile production Tauri library
        run: cargo check --locked --lib
        working-directory: apps/desktop/src-tauri

      - name: Test production Tauri library
        run: cargo test --locked --lib
        working-directory: apps/desktop/src-tauri

      - name: Install dependencies
        run: deno install

      - name: Svelte check
        run: deno task check

      - name: Focused pagination suite
        run: >-
          deno run -A npm:vitest run
          apps/desktop/src/lib/editor/pagination

      - name: Visible WebView2 pagination proof
        env:
          TESINA_PROOF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          deno run -A
          apps/desktop/src/lib/editor/pagination/proof/runNativeProof.ts

  windows-packaged-backup-e2e:
    name: Packaged backup proof (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: deno install --frozen

      - name: Launch the packaged backup proof at the exact feature SHA
        env:
          TESINA_PROOF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task smoke:backup:packaged
