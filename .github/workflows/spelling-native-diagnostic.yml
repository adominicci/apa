name: Spelling native diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/spelling-native-diagnostic.yml"
      - "apps/desktop/src/lib/spelling/**"
      - "apps/desktop/src-tauri/src/spelling/**"
      - "apps/desktop/src-tauri/examples/spelling-proof.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/src/lib.rs"
  workflow_dispatch:

permissions:
  contents: read

# Hosted diagnostics do not replace packaged acceptance targets.
jobs:
  spelling-proof:
    name: Spelling proof (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run focused native spelling tests
        working-directory: apps/desktop/src-tauri
        run: "cargo test --locked spelling:: -- --nocapture"

      - name: Install Deno for the focused IPC contract
        if: matrix.platform == 'macos-latest'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install TypeScript dependencies for the focused IPC contract
        if: matrix.platform == 'macos-latest'
        run: deno install --frozen

      - name: Run focused TypeScript-to-Tauri spelling IPC contract
        if: matrix.platform == 'macos-latest'
        env:
          TESINA_RUN_SPELLING_IPC: "1"
        run: >-
          deno run -A npm:vitest run
          apps/desktop/src/lib/spelling/service.ipc.test.ts
          -t "facade correlation and stable unions"

      - name: Run native spelling proof
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: >-
          cargo run --locked --example spelling-proof
          --features spelling-proof-host
          > ../../../spelling-proof-${{ matrix.platform }}.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spelling-proof-${{ matrix.platform }}
          path: spelling-proof-${{ matrix.platform }}.json
          if-no-files-found: error
