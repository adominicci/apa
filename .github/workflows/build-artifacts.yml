name: Installer build verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} installers
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            expectedSuffixes: '[".app",".dmg"]'
            args: >-
              --target universal-apple-darwin
              --bundles app,dmg
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          - platform: windows-latest
            expectedSuffixes: '[".msi","-setup.exe"]'
            args: >-
              --bundles msi,nsis
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          - platform: ubuntu-22.04
            expectedSuffixes: '[".AppImage",".deb"]'
            args: >-
              --bundles appimage,deb
              --config '{"bundle":{"createUpdaterArtifacts":false}}'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: deno install

      - name: Compile installer bundles
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop
          tauriScript: deno task tauri
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
          args: ${{ matrix.args }}

      - name: Verify installer bundles
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          EXPECTED_INSTALLER_SUFFIXES: ${{ matrix.expectedSuffixes }}
        run: >-
          deno run
          --allow-env=TAURI_ARTIFACT_PATHS,EXPECTED_INSTALLER_SUFFIXES
          --allow-read
          scripts/verify-installer-artifacts.ts
