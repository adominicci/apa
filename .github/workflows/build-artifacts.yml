name: Installer build verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packagedSpellingProof:
        description: Build hidden packaged spelling proof installers
        required: false
        default: false
        type: boolean
      spellingExperienceProof:
        description: Build internal spelling editor proof installers
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} installers
    if: github.event_name == 'push' || !inputs.packagedSpellingProof
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            expectedSuffixes: '[".app",".dmg"]'
            args: >-
              --target universal-apple-darwin
              --bundles app,dmg
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          - platform: windows-latest
            expectedSuffixes: '[".msi","-setup.exe"]'
            args: >-
              --bundles msi,nsis
              --config '{"bundle":{"createUpdaterArtifacts":false}}'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: deno install --frozen

      - name: Compile installer bundles
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop
          tauriScript: deno task tauri
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
          args: ${{ matrix.args }}

      - name: Verify installer bundles
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          EXPECTED_INSTALLER_SUFFIXES: ${{ matrix.expectedSuffixes }}
        run: >-
          deno run
          --allow-env=TAURI_ARTIFACT_PATHS,EXPECTED_INSTALLER_SUFFIXES
          --allow-read
          scripts/verify-installer-artifacts.ts

      - name: Smoke-test the packaged macOS application
        if: matrix.platform == 'macos-latest'
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
        run: >-
          deno run
          --allow-env=TAURI_ARTIFACT_PATHS,GITHUB_SHA
          --allow-run
          scripts/run-packaged-macos-smoke.ts

      - name: Smoke-test packaged portable export and reopen
        if: matrix.platform == 'macos-latest'
        run: deno task smoke:portable:packaged

  packaged-spelling-proof:
    name: Packaged spelling proof (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.packagedSpellingProof
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifactName: tesina-spelling-proof-macos-universal
            artifactPath: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            expectedSuffixes: '[".dmg"]'
            args: >-
              --features packaged-spelling-proof
              --target universal-apple-darwin
              --bundles dmg
              --config src-tauri/tauri.spelling-proof.conf.json
          - platform: windows-latest
            artifactName: tesina-spelling-proof-windows-x64
            artifactPath: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            expectedSuffixes: '["-setup.exe"]'
            args: >-
              --features packaged-spelling-proof
              --bundles nsis
              --config src-tauri/tauri.spelling-proof.conf.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: deno install --frozen

      - name: Compile proof installer
        id: tauri-build
        env:
          VITE_TESINA_PACKAGED_SPELLING_PROOF: "1"
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop
          tauriScript: deno task tauri
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
          args: ${{ matrix.args }}

      - name: Verify proof installer
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          EXPECTED_INSTALLER_SUFFIXES: ${{ matrix.expectedSuffixes }}
        run: >-
          deno run
          --allow-env=TAURI_ARTIFACT_PATHS,EXPECTED_INSTALLER_SUFFIXES
          --allow-read
          scripts/verify-installer-artifacts.ts

      - name: Upload proof installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  spelling-experience-proof:
    name: Spelling experience proof (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.spellingExperienceProof
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifactName: tesina-spelling-experience-proof-macos-universal
            artifactPath: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            expectedSuffixes: '[".dmg"]'
            args: >-
              --target universal-apple-darwin
              --bundles dmg
              --config src-tauri/tauri.spelling-experience-proof.conf.json
          - platform: windows-latest
            artifactName: tesina-spelling-experience-proof-windows-x64
            artifactPath: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            expectedSuffixes: '["-setup.exe"]'
            args: >-
              --bundles nsis
              --config src-tauri/tauri.spelling-experience-proof.conf.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install dependencies
        run: deno install --frozen
      - name: Compile internal editor proof installer
        id: tauri-build
        env:
          VITE_TESINA_SPELLING_EXPERIENCE_PROOF: "1"
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop
          tauriScript: deno task tauri
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
          args: ${{ matrix.args }}
      - name: Verify proof installer
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          EXPECTED_INSTALLER_SUFFIXES: ${{ matrix.expectedSuffixes }}
        run: >-
          deno run
          --allow-env=TAURI_ARTIFACT_PATHS,EXPECTED_INSTALLER_SUFFIXES
          --allow-read
          scripts/verify-installer-artifacts.ts
      - name: Upload proof installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
